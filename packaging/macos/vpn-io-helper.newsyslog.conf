# /etc/newsyslog.d/vpn-io-helper.conf — rotate the vpn.io helper log.
#
# The helper is an info-level daemon that logs per connection; without rotation
# it grows /var/log/vpn-io-helper.log without bound on a user's machine (#149).
# launchd re-opens its StandardOutPath after a rotation, so the live file is
# bounded, not just the compressed archives.
#
# logfile                     mode  count  size(KB)  when  flags
/var/log/vpn-io-helper.log    644   7      5120      *     J
