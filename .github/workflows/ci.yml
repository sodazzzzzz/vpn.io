name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Every fuzz target gets a fixed, small budget. This is not a fuzzing
      # campaign — `go test` already replays each target's seed corpus and any
      # committed regression inputs on every run, which is what stops a fixed
      # crash from coming back. This job adds a short random search on top, so a
      # shallow new bug is caught in the pull request that introduces it rather
      # than never. Bounded on purpose: a job whose runtime creeps upward is a
      # job someone eventually deletes.
      #
      # A crash found here writes the input to testdata/ in the runner's
      # workspace; it is printed in the log and must be committed as a
      # regression seed with the fix.
      - name: fuzz each target
        run: |
          set -euo pipefail
          budget=40s
          while read -r pkg target; do
            echo "==> $pkg $target ($budget)"
            go test "$pkg" -run '^$' -fuzz "^${target}$" -fuzztime "$budget"
          done <<'TARGETS'
          ./internal/frame FuzzReadFrame
          ./internal/frame FuzzRoundTrip
          ./internal/tunnel FuzzReadPacket
          ./internal/tunnel FuzzDecodeControl
          ./internal/profile FuzzParseBundle
          TARGETS

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 } # build-only: compiles the *_darwin.go files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Build every non-GUI binary for each target OS, so a go.mod/scripts
      # refactor can't break the darwin/windows helper unnoticed before release.
      # vpn-gui is a separate CGO/Wails module; its native build lives in the desktop workflows.
      - name: build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: >-
          go build
          ./cmd/vpn-ca
          ./cmd/vpn-server
          ./cmd/vpn-client
          ./cmd/vpn-helper
          ./cmd/vpn-bot
          ./cmd/vpn-ctl

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on the ubuntu-latest image — no extra action needed.
      # Covers the root-privileged installer logic in packaging/ and the scripts/ helpers.
      - name: shellcheck
        run: find packaging scripts -name '*.sh' -print0 | xargs -0 -r shellcheck
