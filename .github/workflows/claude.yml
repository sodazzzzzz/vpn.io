name: Claude Mention Handler

# Responds when someone writes "@claude ..." in an issue, PR, or review
# comment. Requires the "claude" GitHub App + CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Two gates, both required.
    #
    # 1. The body/title actually mentions @claude.
    # 2. The author is the repository owner.
    #
    # Gate 2 is a security boundary, not tidiness. This job hands the agent
    # `contents: write`, and the text that reaches it is attacker-controlled:
    # anyone able to open an issue or leave a comment would otherwise be able
    # to steer it via the issue body ("@claude ... now run git push ...") into
    # writing to the repository. Today only the repo's privacy limits who that
    # is; the day it goes public the gate is the only thing left.
    #
    # OWNER is deliberately narrow — widening to
    # `contains(fromJSON('["OWNER","COLLABORATOR"]'), ...)` grants every
    # collaborator write-capable runs, so do it consciously.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # No prompt — Claude responds interactively to the @claude mention.
