name: Claude Auto Review

# Automatic AI review on every pull request.
# Requires: the "claude" GitHub App installed on the repo and a
# CLAUDE_CODE_OAUTH_TOKEN secret. See .github/CLAUDE_REVIEW_SETUP.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # let Claude read CI results on the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Сделай ревью этого pull request как опытный Go-инженер.
            Проект — кроссплатформенный VPN на Go (TUN, TLS/mTLS, свой wire-protocol).
            Это PR #${{ github.event.pull_request.number }} в репозитории ${{ github.repository }}.

            ВАЖНО (это может быть ПОВТОРНЫЙ прогон на обновлённом PR): прежде
            чем оставлять inline-замечания, прочитай уже существующие комментарии
            командой `gh pr view ${{ github.event.pull_request.number }} --comments` —
            там твои прошлые сводки находок и ответы автора о том, что исправлено
            или осознанно отклонено. НЕ постий замечание повторно, если выполнено
            любое из:
              - оно уже было оставлено в одном из прошлых прогонов;
              - относящийся к нему код уже изменён/исправлен в более поздних
                коммитах (всегда сверяйся с АКТУАЛЬНЫМ состоянием файла через
                Read и `git log`, а не с первоначальным диффом);
              - автор уже пометил его как осознанно отклонённое.
            Постий только реально новые, ещё не разобранные замечания.

            Сфокусируйся на:
              - корректность: гонки данных, дедлоки, утечки горутин/ресурсов,
                ошибки обработки сетевых ошибок и graceful shutdown;
              - безопасность: TLS/mTLS, валидация пакетов, anti-spoof/isolation,
                обращение с приватными ключами и сертификатами;
              - идиоматичность Go и согласованность со стилем окружающего кода;
              - реальные баги важнее придирок — отмечай уверенные находки,
                неуверенные помечай как таковые.
            Конкретные замечания оставляй inline-комментариями со ссылкой на
            файл и строку через инструмент
            mcp__github_inline_comment__create_inline_comment.

            ВАЖНО ПРО ИТОГ: твой текстовый ответ сам по себе на PR НЕ виден —
            единственный видимый след оставляет команда `gh pr comment`. Поэтому
            ПОСЛЕДНИМ ШАГОМ ты ОБЯЗАН ровно один раз выполнить:
              gh pr comment ${{ github.event.pull_request.number }} --body "<резюме>"
            с кратким общим резюме: вердикт по PR и перечень новых находок, либо
            явное «Новых замечаний нет», если их нет. Делай это ВСЕГДА, в том
            числе когда находок нет. Указывай номер PR явно (как выше), иначе
            команда не определит PR и упадёт. Пиши по-русски.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*)"
