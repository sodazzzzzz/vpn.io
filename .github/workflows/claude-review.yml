name: Claude Auto Review

# Automatic AI review on every pull request.
# Requires: the "claude" GitHub App installed on the repo and a
# CLAUDE_CODE_OAUTH_TOKEN secret. See .github/CLAUDE_REVIEW_SETUP.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # let Claude read CI results on the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # The official /code-review plugin handles inline-comment posting
          # itself (tool permissions are declared by the plugin), so we drive
          # it and just append our project-specific focus.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Проект — кроссплатформенный VPN на Go (TUN, TLS/mTLS, свой wire-protocol).
            Особое внимание (отвечай по-русски):
              - корректность конкурентности: гонки данных, дедлоки,
                утечки горутин/ресурсов, обработка сетевых ошибок, graceful shutdown;
              - безопасность: TLS/mTLS, валидация пакетов, anti-spoof/isolation,
                обращение с приватными ключами и сертификатами;
              - идиоматичность Go и согласованность со стилем окружающего кода.
          claude_args: "--max-turns 30"
