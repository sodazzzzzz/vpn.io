name: release

# Cuts a GitHub Release when a vX.Y.Z tag is pushed: builds the Linux server +
# bot + CA binaries and both desktop installers, then attaches them (plus a
# SHA256SUMS) to the release. The VPS pulls these with packaging/server/vpn-update.sh.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  server-bot:
    name: build server + bot (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build linux binaries
        run: |
          mkdir -p out
          for cmd in vpn-server vpn-bot vpn-ca; do
            GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "out/$cmd" "./cmd/$cmd"
          done
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: server-bot
          path: out/*
          if-no-files-found: error

  windows:
    name: build installer (windows/amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: ensure NSIS on PATH
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsis) { Add-Content -Path $env:GITHUB_PATH -Value $nsis }
      - name: build helper daemon
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/vpn-helper.exe ./cmd/vpn-helper
          Copy-Item dist/vpn-helper.exe cmd/vpn-gui/build/windows/vpn-helper.exe
      - name: fetch and verify Wintun driver
        working-directory: cmd/vpn-gui/build/windows
        run: |
          $url  = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $want = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51" # wintun.net, v0.14.1
          Invoke-WebRequest -Uri $url -OutFile wintun.zip
          $got = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { Write-Error "Wintun checksum mismatch: got $got, want $want"; exit 1 }
          Expand-Archive -Path wintun.zip -DestinationPath wintun-tmp -Force
          Copy-Item wintun-tmp/wintun/bin/amd64/wintun.dll -Destination wintun.dll
          Remove-Item wintun.zip
          Remove-Item -Recurse wintun-tmp
      - name: stamp version into wails.json
        # The NSIS installer's version (Add/Remove Programs, future in-app
        # update) comes from wails.json info.productVersion, which is otherwise
        # static — so a v0.2.0 tag would ship an installer calling itself
        # something else (#151). Inject the tag version before building.
        working-directory: cmd/vpn-gui
        run: |
          $v = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $json = Get-Content wails.json -Raw | ConvertFrom-Json
          $json.info | Add-Member -NotePropertyName productVersion -NotePropertyValue $v -Force
          $json | ConvertTo-Json -Depth 20 | Set-Content wails.json
          Get-Content wails.json
      - name: build GUI + installer
        working-directory: cmd/vpn-gui
        run: wails build -nsis
      - name: name the installer
        working-directory: cmd/vpn-gui/build/bin
        run: |
          $inst = Get-ChildItem *-amd64-installer.exe | Select-Object -First 1
          if (-not $inst) { Write-Error "installer .exe not found in build/bin"; exit 1 }
          Copy-Item $inst.FullName vpn-io-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: cmd/vpn-gui/build/bin/vpn-io-setup.exe
          if-no-files-found: error

  macos:
    name: build installer (darwin/universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: build .pkg
        run: VERSION="${GITHUB_REF_NAME#v}" packaging/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/vpn.io.pkg
          if-no-files-found: error

  linux-desktop:
    # Two .deb builds, one per WebKit ABI, because it splits across distro
    # generations: the modern 4.1 build is the unsuffixed default (Ubuntu 24.04+
    # / Debian 13+), the 4.0 build is the "_legacy-webkit4.0" file (Ubuntu 22.04
    # / Debian 11-12). A single 4.0 .deb was uninstallable on current Ubuntu (#140).
    name: build desktop .deb (${{ matrix.webkit.tag }})
    runs-on: ${{ matrix.webkit.runner }}
    strategy:
      fail-fast: false
      matrix:
        webkit:
          - { tag: webkit2_41, runner: ubuntu-24.04, dev: libwebkit2gtk-4.1-dev, dep: libwebkit2gtk-4.1-0,  filesuffix: "" }
          - { tag: webkit2_40, runner: ubuntu-22.04, dev: libwebkit2gtk-4.0-dev, dep: libwebkit2gtk-4.0-37, filesuffix: "_legacy-webkit4.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install GTK/WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev ${{ matrix.webkit.dev }}
      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: build GUI
        working-directory: cmd/vpn-gui
        run: wails build -tags ${{ matrix.webkit.tag }}
      - name: build helper daemon
        run: go build -trimpath -ldflags="-s -w" -o dist/vpn-helper ./cmd/vpn-helper
      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
      - name: package .deb
        # Stamp the version from the tag (nfpm reads ${VERSION}); it was hardcoded
        # 0.1.0 in the CI-only desktop-linux.yml and never reached releases (#151).
        # WEBKIT_DEP pins the runtime dependency to the ABI we linked against.
        env:
          VERSION: ${{ github.ref_name }}
          WEBKIT_DEP: ${{ matrix.webkit.dep }}
        run: |
          export VERSION="${VERSION#v}"   # nfpm rejects a leading 'v'
          nfpm package --config packaging/deb/nfpm.yaml --packager deb \
            --target "dist/vpn-io_${VERSION}_amd64${{ matrix.webkit.filesuffix }}.deb"
          ls -lh dist/*.deb
          dpkg-deb --info dist/*.deb | grep -i depends   # confirm the ABI dep resolved
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-deb-${{ matrix.webkit.tag }}
          path: dist/vpn-io_*.deb
          if-no-files-found: error

  publish:
    name: publish release
    needs: [server-bot, windows, macos, linux-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: stage assets + checksums
        run: |
          mkdir -p rel
          cp artifacts/server-bot/vpn-server      rel/
          cp artifacts/server-bot/vpn-bot         rel/
          cp artifacts/server-bot/vpn-ca          rel/
          cp artifacts/windows-installer/vpn-io-setup.exe rel/
          cp artifacts/macos-pkg/vpn.io.pkg       rel/
          # Both WebKit-ABI .deb builds (linux-desktop-deb-webkit2_40/_41).
          cp artifacts/linux-desktop-deb-*/vpn-io_*.deb rel/
          chmod +x rel/vpn-server rel/vpn-bot rel/vpn-ca
          ( cd rel && sha256sum * > SHA256SUMS )
          ls -lh rel
      - name: sign checksums (minisign)
        # SHA256SUMS travels the same channel as the binaries, so signing it with
        # a key held only here (not on any release asset) is the independent trust
        # anchor vpn-update.sh pins against (#123). Fail closed: no signing secret
        # => no release, rather than an unverifiable one.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY secret is not set — cannot sign the release" >&2
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # minisign reads the key password from stdin when stdin isn't a tty.
          printf '%s' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m rel/SHA256SUMS -x rel/SHA256SUMS.minisig
          rm -f "$key"
          test -s rel/SHA256SUMS.minisig || { echo "signing produced no signature" >&2; exit 1; }
          ls -lh rel
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            rel/*
